// ── Storage ────────────────────────────────────────────────────────────────
async function loadPropostas() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    if (r?.value) {
      const props = JSON.parse(r.value);
      props.forEach(p => {
        if (!p.createdAt) {
          p.createdAt = p.validade
            ? new Date(new Date(p.validade).getTime() - 7*24*60*60*1000).toISOString()
            : new Date().toISOString();
        }
      });
      return props;
    }
  } catch(_) {}
  return [];
}
async function savePropostas(propostas) {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(propostas)); } catch(_) {}
}
async function loadCustomClientes() {
  try { const r = await window.storage.get(STORAGE_CLIENTES); if (r?.value) return JSON.parse(r.value); } catch(_) {}
  return [];
}
async function saveCustomClientes(clientes) {
  try { await window.storage.set(STORAGE_CLIENTES, JSON.stringify(clientes)); } catch(_) {}
}
async function loadCustomProdutos() {
  try { const r = await window.storage.get(STORAGE_PRODUTOS); if (r?.value) return JSON.parse(r.value); } catch(_) {}
  return [];
}
async function saveCustomProdutos(produtos) {
  try { await window.storage.set(STORAGE_PRODUTOS, JSON.stringify(produtos)); } catch(_) {}
}

function exportPropostas(propostas) {
  const json = JSON.stringify(propostas, null, 2);
  const uri = "data:application/json;charset=utf-8," + encodeURIComponent(json);
  const a = document.createElement("a");
  a.setAttribute("href", uri);
  a.setAttribute("download", `chazan_propostas_${new Date().toISOString().slice(0,10)}.json`);
  a.click();
}

const FOLLOWUP_DAYS = [2, 5, 10];
function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}
function getPropostaAge(p) {
  // Try crm_updated_at first (last interaction), then createdAt, then validade-7days
  const fromUpdate = daysSince(p.crm_updated_at);
  if (fromUpdate !== null) return fromUpdate;
  const fromCreated = daysSince(p.createdAt);
  if (fromCreated !== null) return fromCreated;
  // Fallback: use validade date minus 7 days (default validity period)
  if (p.validade) {
    const validade = new Date(p.validade);
    const created = new Date(validade.getTime() - 7 * 24 * 60 * 60 * 1000);
    const now = new Date();
    const days = Math.floor((now - created) / (1000 * 60 * 60 * 24));
    return Math.max(0, days);
  }
  return null; // unknown age - don't alert
}
function getAlerts(propostas) {
  // Only active proposals (not ganha/perdida)
  const active = propostas.filter(p => !["ganha","perdida"].includes(p.crm_status));
  const alerts = [];
  for (const p of active) {
    const days = getPropostaAge(p);
    if (days === null) continue; // unknown age - skip
    const hit = [...FOLLOWUP_DAYS].reverse().find(d => days >= d);
    if (hit) alerts.push({ proposta: p, days, hit });
  }
  // Sort by most overdue first
  return alerts.sort((a, b) => b.days - a.days);
}
function getEncargo(pagamento) {
  return ENCARGOS[pagamento] || 0;
}
function aplicaEncargo(preco, pagamento) {
  return preco * (1 + getEncargo(pagamento));
}

function calcTotal(p) {
  if (!p?.itens) return 0;
  const bruto = p.itens.reduce((s, it) => s + it.qty * it.unitario * (1 - (it.desconto || 0) / 100), 0);
  return bruto * (1 - (Number(p.desconto) || 0) / 100);
}
function calcPesoTotal(itens) {
  return (itens || []).reduce((s, it) => s + (Number(it.peso_unit) || 0) * it.qty, 0);
}
function calcVolumeTotal(itens) {
  return (itens || []).reduce((s, it) => {
    const prod = findProduto(it.produtoId) || it;
    const vol = Number(prod.volume_emb) || 0;
    // volume_emb = m³ por unidade (m², pç, RL, etc.)
    // total = quantidade × volume por unidade
    return s + vol * it.qty;
  }, 0);
}
const VOL = v => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 4, maximumFractionDigits: 4 }) + " m³";

async function sbSaveAll(propostas, clientes, produtos) {
  // Upsert all propostas
  const rows = propostas.map(p => ({ id: p.id, data: p, updated_at: new Date().toISOString() }));
  if (!rows.length) return { ok: true };
  const res = await fetch(SB_URL + "/rest/v1/propostas?on_conflict=id", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify(rows)
  });
  if (!res.ok) throw new Error("Supabase error: " + res.status);
  // Also save meta (clientes/produtos)
  await fetch(SB_URL + "/rest/v1/propostas?on_conflict=id", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify([{ id: "__meta__", data: { clientes, produtos }, updated_at: new Date().toISOString() }])
  });
  return { ok: true };
}

async function sbLoadAll() {
  const res = await fetch(SB_URL + "/rest/v1/propostas?select=id,data&order=updated_at.desc", {
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
  });
  if (!res.ok) throw new Error("Supabase error: " + res.status);
  const rows = await res.json();
  const meta = rows.find(r => r.id === "__meta__");
  const propostas = rows.filter(r => r.id !== "__meta__").map(r => r.data);
  return {
    propostas,
    clientes: meta?.data?.clientes || [],
    produtos: meta?.data?.produtos || []
  };
}

    if (action === "new_proposta") {
      const num = "P-" + String(propostas.length + 1).padStart(3, "0");
      const validade = addDays(7);
      setDraft({ numero: num, clienteId: "", industriaId: "", tabela: "", itens: [], desconto: 0, pagamento: "", frete: "", valorFrete: 0, obs: "", status: "rascunho", data: new Date().toISOString().slice(0, 10), validade });
      pushBot({ id: "np_cli", text: `Nova proposta *${num}* 🚀

Busque o cliente (nome ou CNPJ):`, inputMode: "np_cliente",
        chips: [{ label: "❌ Cancelar", value: "cancelar_proposta" }]
      });
      return;
    }

    if (action === "np_select_cliente") {
      setDraft(d => ({ ...d, clienteId: data.id }));
      const indChips = [
        ...SEED_DATA.industrias.map(i => ({ label: i.nome, value: "np_select_industria", data: i })),
        { label: "❌ Cancelar", value: "cancelar_proposta" },
      ];
      pushBot({ id: "np_ind", text: `✅ *${data.nome}*\n\nQual indústria?`, chips: indChips });
      return;
    }

    if (action === "np_select_industria") {
      setDraft(d => ({ ...d, industriaId: data.id, _ind: data }));
      // Ask tabela type
      pushBot({
        id: "np_tabela",
        text: `🏭 *${data.nome}*

Qual tabela usar?`,
        chips: [
          { label: "🏪 Revenda", value: "np_select_tabela", data: { ind: data, tipo: "revenda" } },
          { label: "🏗 Construtora", value: "np_select_tabela", data: { ind: data, tipo: "construtora" } },
          { label: "❌ Cancelar", value: "cancelar_proposta" },
        ]
      });
      return;
    }

    if (action === "np_select_tabela") {
      const { ind, tipo } = data;
      const resolvedIndId = ind?.id || draft?.industriaId;
      setDraft(d => ({ ...d, tabela: tipo, industriaId: resolvedIndId, _ind: ind || d?._ind }));
      pushBot({ id: "np_prod", text: `✅ Tabela *${tipo}* selecionada.

Busque o produto (nome ou código):`, inputMode: "np_prod_search", _indId: resolvedIndId,
        chips: [{ label: "❌ Cancelar", value: "cancelar_proposta" }]
      });
      return;
    }

    if (action === "np_select_produto") {
      const tabela = draft?.tabela || "revenda";
      const preco = tabela === "construtora" && data.preco_construtora
        ? data.preco_construtora
        : data.preco_revenda || data.preco;
      const prodComPreco = { ...data, preco };
      const embMin = data.emb_min || 1;
      const unidade = data.unidade || "";
      const qtys = [];
      for (let i = 1; i <= 6; i++) qtys.push(Math.round(embMin * i * 10) / 10);
      setDraft(d => ({ ...d, _pendingProd: prodComPreco, _embMin: embMin }));
      pushBot({
        id: "np_qty",
        text: `📦 *${data.nome}*\nPreço (${tabela}): *${BRL(preco)}* / ${unidade}${data.peso_unit > 0 ? ` · ${data.peso_unit} kg/un` : ""}${embMin > 1 ? `\n⚠️ Qtd mínima: *${embMin} ${unidade}*` : ""}\n\nQuantidade:`,
        inputMode: "np_qty",
        chips: qtys.map(n => ({ label: `${n} ${unidade}`, value: "np_set_qty", data: n }))
      ,
        chips: [{ label: "❌ Cancelar", value: "cancelar_proposta" }]
      });
      return;
    }

    if (action === "np_set_qty") { confirmItem(data); return; }

    if (action === "np_add_item") {
      const _indId2 = draft?.industriaId;
      const _ind2 = SEED_DATA.industrias.find(i => i.id === _indId2);
      const _nProd2 = SEED_DATA.produtos.filter(p => p.industriaId === _indId2).length;
      pushBot({ id: "np_prod2", text: `🏭 ${_ind2?.nome || "Indústria"} · ${_nProd2} produto(s)\n\nBusque o próximo produto:`, inputMode: "np_prod_search", _indId: _indId2,
        chips: [{ label: "❌ Cancelar", value: "cancelar_proposta" }]
      }); return;
    }

    if (action === "np_edit_item") {
      // data = item, show edit options
      setEditingItem(data);
      pushBot({
        id: "np_edit",
        text: `✏️ Editando: *${data.nome}*
Atual: ${BRL(data.unitario)} × ${data.qty} = ${BRL(data.unitario * data.qty)}

O que editar?`,
        chips: [
          { label: "💰 Preço", value: "np_edit_preco", data },
          { label: "📦 Quantidade", value: "np_edit_qty", data },
          { label: "🗑 Remover Item", value: "np_remove_item", data },
          { label: "✅ Manter atual", value: "np_after_item_back" },
        ,
          { label: "❌ Cancelar", value: "cancelar_proposta" }]
      });
      return;
    }

    if (action === "np_edit_preco") {
      setEditingItem(data);
      pushBot({ id: "np_ep", text: `Preço atual: *${BRL(data.unitario)}*

Digite o novo preço:`, inputMode: "np_edit_preco_input" });
      return;
    }

    if (action === "np_edit_qty") {
      setEditingItem(data);
      pushBot({ id: "np_eq", text: `Quantidade atual: *${data.qty}*

Digite a nova quantidade:`, inputMode: "np_edit_qty_input",
        chips: [
          ...[1,2,5,10,20,50,100].map(n => ({ label: String(n), value: "np_set_edit_qty", data: n })),
          { label: "❌ Cancelar", value: "cancelar_proposta" },
        ] });
      return;
    }

    if (action === "np_set_edit_qty") {
      applyItemEdit({ qty: data }); return;
    }

    if (action === "np_remove_item") {
      setDraft(d => ({ ...d, itens: d.itens.filter(it => it.id !== data.id) }));
      setTimeout(() => stepAfterItem(), 50); return;
    }

    if (action === "np_after_item_back") { stepAfterItem(); return; }

    if (action === "np_salvar_rapido") { saveAndDone(); return; }

    if (action === "np_pagamento") {
      pushBot({
        id: "np_pag", text: "💳 Condição de pagamento:",
        chips: [
          ...["Antecipado","7 Dias","28 Dias","28/56 Dias","28/42/56 Dias","28/42/56/70/84 Dias","A definir"].map(p => ({ label: p, value: "np_set_pagamento", data: p })),
          { label: "❌ Cancelar", value: "cancelar_proposta" },
        ]
      }); return;
    }

    if (action === "np_set_pagamento") {
      const encargo = getEncargo(data);
      const encargoInfo = encargo > 0 ? ` *(+${(encargo*100).toFixed(2)}% encargo)*` : " *(sem encargo)*";
      setDraft(d => {
        if (!d) return d;
        const itens = (d.itens || []).map(it => {
          const prod = findProduto(it.produtoId) || it;
          const precoBase = d.tabela === "construtora"
            ? (prod.preco_construtora || prod.preco_revenda || prod.preco || 0)
            : (prod.preco_revenda || prod.preco || 0);
          return { ...it, unitario: round4(precoBase * (1 + encargo)) };
        });
        return { ...d, pagamento: data, itens };
      });
      pushBot({ id: "np_fr", text: `✅ Pagamento: *${data}*${encargoInfo}

Frete:`,
        chips: [
          ...["FOB","CIF","A definir"].map(f => ({ label: f, value: "np_set_frete", data: f })),
          { label: "❌ Cancelar", value: "cancelar_proposta" },
        ] });
      return;
    }

    if (action === "np_set_frete") {
      setDraft(d => ({ ...d, frete: data }));
      pushBot({ id: "np_vfrete", text: `✅ Frete: *${data}*

Informe o valor do frete (R$) ou pule:`,
        inputMode: "np_valor_frete",
        chips: [{ label: "⏭ Sem Frete", value: "np_set_valor_frete", data: 0 },
          { label: "❌ Cancelar", value: "cancelar_proposta" }] });
      return;
    }

    if (action === "np_set_valor_frete") {
      setDraft(d => ({ ...d, valorFrete: Number(data) || 0 }));
      pushBot({ id: "np_desc", text: `✅ Frete: *${data > 0 ? BRL(data) : "sem custo informado"}*\n\nDesconto geral (%)?`,
        chips: [
          ...["0%","3%","5%","8%","10%","15%"].map(d => ({ label: d, value: "np_set_desconto", data: parseInt(d) })),
          { label: "❌ Cancelar", value: "cancelar_proposta" },
        ] });
      return;
    }

    if (action === "np_set_desconto") {
      setDraft(d => ({ ...d, desconto: data }));
      pushBot({ id: "np_val", text: `✅ Desconto: *${data}%*

Validade da proposta? (padrão: 7 dias)`,
        inputMode: "np_validade",
        chips: [
          { label: "7 dias", value: "np_set_validade", data: addDays(7) },
          { label: "15 dias", value: "np_set_validade", data: addDays(15) },
          { label: "30 dias", value: "np_set_validade", data: addDays(30) },
        ,
          { label: "❌ Cancelar", value: "cancelar_proposta" }]
      });
      return;
    }

    if (action === "np_set_validade") {
      setDraft(d => ({ ...d, validade: data }));
      pushBot({ id: "np_obs", text: `✅ Válida até *${fmtDate(data)}*

Observações? (ou pule)`,
        inputMode: "np_obs",
        chips: [{ label: "⏭ Pular", value: "np_set_obs", data: "" },
          { label: "❌ Cancelar", value: "cancelar_proposta" }] });
      return;
    }

    if (action === "np_set_obs") { finalizeProposta(data || ""); return; }
  };

  // ─────────────────────────────────────────────────────────────────────────
  // PROCESS TEXT INPUT
  // ─────────────────────────────────────────────────────────────────────────
  const processInput = (val) => {
    const currentStep = stepRef.current || step;
    if (!currentStep) return;
    const mode = currentStep.inputMode;
    if (!mode) return;

    if (mode === "crm_info_input") {
      setDraft(d => {
        if (!d?._crmProposta) return d;
        const status = d._crmStatus;
        const extra = status === "ganha"
          ? { crm_valor_fechado: Number(val.replace(/[^\d.,]/g,"").replace(",",".")) || 0 }
          : { crm_motivo_perda: val };
        const updated = propostas.map(p => p.id === d._crmProposta.id ? { ...p, crm_status: status, crm_updated_at: new Date().toISOString(), ...extra } : p);
        setPropostas(updated); savePropostas(updated);
        pushBot({ id:"crm_done3",
          text: status === "ganha"
            ? `✅ Ganha! Valor fechado: *${BRL(extra.crm_valor_fechado || calcTotal(d._crmProposta))}*`
            : `❌ Perdida. Motivo: *${val}*`,
          chips:[{label:"📊 Dashboard",value:"crm_dashboard"},{label:"🏠 Menu",value:"menu"}]
        });
        return null;
      }); return;
    }
    if (mode === "search_cliente") {
      const todosClientes = [...SEED_DATA.clientes, ...customClientes];
      const valNorm = val.toLowerCase().replace(/[^a-z0-9]/g, "");
      const valDigits = val.replace(/[^0-9]/g,"");
      const r = todosClientes.filter(c =>
        c.nome.toLowerCase().includes(val.toLowerCase()) ||
        (c.cnpj||"").includes(val) ||
        (valDigits.length > 3 && (c.cnpj||"").replace(/[^0-9]/g,"").includes(valDigits))
      ).slice(0,8);
      if (!r.length) { pushBot({ id: "nc", text: "Nenhum cliente encontrado. Tente:", inputMode: "search_cliente" }); return; }
      pushBot({ id: "cr", text: `${r.length} resultado(s):`, type: "cliente_cards", items: r, chips: [{ label: "🔍 Nova Busca", value: "search_cliente" }, { label: "🏠 Menu Inicial", value: "menu" }] });
      return;
    }

    if (mode === "np_cliente") {
      const todosClientes = [...SEED_DATA.clientes, ...customClientes];
      const r = todosClientes.filter(c =>
        c.nome.toLowerCase().includes(val.toLowerCase()) ||
        (c.cnpj||"").includes(val)
      ).slice(0,8);
      if (!r.length) { pushBot({ id: "nc2", text: "Nenhum cliente encontrado. Tente outro termo:", inputMode: "np_cliente", chips: [{ label: "❌ Cancelar", value: "cancelar_proposta" }, { label: "🏠 Menu Inicial", value: "menu" }] }); return; }
      pushBot({ id: "ncr", text: `${r.length} resultado(s). Selecione:`, chips: r.map(c => ({ label: c.nome.length > 38 ? c.nome.slice(0,36)+"…" : c.nome, value: "np_select_cliente", data: c })) });
      return;  }

    if (mode === "search_produto") {
      const r = SEED_DATA.produtos.filter(p => p.nome.toLowerCase().includes(val.toLowerCase()) || (p.codigo||"").includes(val)).slice(0,8);
      if (!r.length) { pushBot({ id: "np2", text: "Nenhum produto. Tente:", inputMode: "search_produto" }); return; }
      pushBot({ id: "pr", text: `${r.length} produto(s):`, type: "produto_cards", items: r, chips: [{ label: "🔍 Nova Busca", value: "search_produto" }, { label: "🏠 Menu Inicial", value: "menu" }] });
      return;
    }

    if (mode === "busca_proposta") {
      const termo = val.trim().toLowerCase();
      const todosCli = [...SEED_DATA.clientes, ...customClientes];
      const resultado = propostas.filter(p => {
        if (!termo) return true;
        const cli = todosCli.find(c => c.id === p.clienteId);
        const nomeCliente = (cli?.nome || p.clienteNome || "").toLowerCase();
        const numero = (p.numero || "").toLowerCase();
        return nomeCliente.includes(termo) || numero.includes(termo);
      }).sort((a,b) => (b.numero||"").localeCompare(a.numero||""));
      if (!resultado.length) {
        pushBot({ id:"sp_nf", text:`Nenhuma proposta encontrada para "${val}". Tente outro nome:`, inputMode: "busca_proposta",
          chips: [{ label: "📋 Ver todas", value: "ver_todas_propostas" }, { label: "🏠 Menu", value: "menu" }]
        }); return;
      }
      setMsgs(m => [...m, { id: uid(), from: "bot", type: "proposta_list", propostas: resultado }]);
      pushBot({ id:"sp_res", text:`${resultado.length} proposta(s) encontrada(s) para "${val}".`,
        chips: [{ label: "🔍 Nova busca", value: "search_propostas" }, { label: "🏠 Menu", value: "menu" }]
      }); return;
    }

    if (mode === "np_prod_search") {
      const indId = stepRef.current?._indId || draft?.industriaId || draft?._ind?.id;
      const ind = SEED_DATA.industrias.find(i => i.id === indId);
      const todosProdutos = [...SEED_DATA.produtos, ...customProdutos];
      const r = todosProdutos.filter(p => p.industriaId === indId && (p.nome.toLowerCase().includes(val.toLowerCase()) || (p.codigo||"").includes(val))).slice(0,10);
      if (!indId) { pushBot({ id: "npnf", text: `⚠️ Indústria não identificada. Tente novamente a partir da seleção de indústria.`, chips: [{ label: "🏠 Menu", value: "menu" }] }); return; }
      if (!r.length) { pushBot({ id: "npnf", text: `Nenhum produto encontrado em *${ind?.nome || indId}* para "${val}". Tente outro termo:`, inputMode: "np_prod_search", _indId: indId }); return; }
      pushBot({ id: "npr", text: `${r.length} produto(s):`, chips: r.map(p => {
        const tabela = draft?.tabela || "revenda";
        const preco = tabela === "construtora" && p.preco_construtora ? p.preco_construtora : p.preco_revenda || p.preco;
        const embInfo = p.emb_min && p.emb_min > 1 ? ` | mín: ${p.emb_min}` : "";
        return { label: `${p.codigo ? "["+p.codigo+"] " : ""}${p.nome.length > 28 ? p.nome.slice(0,26)+"…" : p.nome} — ${BRL(preco)}${embInfo}`, value: "np_select_produto", data: p };
      }) });
      return;
    }

    if (mode === "np_qty") {
      const qty = Number(val.replace(",","."));
      if (!qty || qty <= 0) { pushBot({ ...step, text: "Quantidade inválida. Tente:" }); return; }
      const embMin = draft?._embMin || 1;
      if (embMin > 1 && qty < embMin) {
        pushBot({ ...step, text: `⚠️ Quantidade mínima é *${embMin}*. Digite novamente:` }); return;
      }
      if (embMin > 1 && (qty % embMin) > 0.001) {
        const sugerido = Math.ceil(qty / embMin) * embMin;
        pushBot({ ...step, text: `⚠️ Deve ser múltiplo de *${embMin}*. Mais próximo: *${sugerido}*. Confirma ou digite outro valor:`,
          chips: [{ label: `✅ ${sugerido}`, value: "np_set_qty", data: sugerido }] }); return;
      }
      confirmItem(qty); return;
    }

    if (mode === "np_edit_preco_input") {
      const preco = parseFloat(val.replace(",","."));
      if (isNaN(preco) || preco < 0) { pushBot({ ...step, text: "Preço inválido. Digite novamente:" }); return; }
      applyItemEdit({ unitario: preco }); return;
    }

    if (mode === "np_edit_qty_input") {
      const qty = Number(val);
      if (!qty || qty <= 0) { pushBot({ ...step, text: "Quantidade inválida:" }); return; }
      applyItemEdit({ qty }); return;
    }

    if (mode === "np_valor_frete") {
      const v = parseFloat(val.replace(",","."));
      processAction("np_set_valor_frete", val, isNaN(v) ? 0 : v); return;
    }

    if (mode === "np_validade") {
      // accept DD/MM/YYYY
      const parts = val.split("/");
      if (parts.length === 3) {
        const iso = `${parts[2]}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`;
        processAction("np_set_validade", val, iso);
      } else {
        processAction("np_set_validade", val, addDays(7));
      }
      return;
    }

    if (mode === "np_obs") { finalizeProposta(val); return; }
  };

  // ─────────────────────────────────────────────────────────────────────────
  // SUB-FLOWS
  // ─────────────────────────────────────────────────────────────────────────
  const confirmItem = (qty) => {
    setDraft(d => {
      const prod = d._pendingProd;
      if (!prod) return d;
      const encargo = getEncargo(d?.pagamento);
      const precoBase = d.tabela === "construtora"
        ? (prod.preco_construtora || prod.preco_revenda || prod.preco || 0)
        : (prod.preco_revenda || prod.preco || 0);
      const unitario = round4(precoBase * (1 + encargo));
      const item = { id: uid(), produtoId: prod.id, nome: prod.nome, codigo: prod.codigo, unidade: prod.unidade, unitario, qty: Number(qty), desconto: 0, peso_unit: prod.peso_unit || 0 };
      return { ...d, itens: [...d.itens, item], _pendingProd: null };
    });
    setTimeout(() => stepAfterItem(), 50);
  };

  const applyItemEdit = (changes) => {
    setDraft(d => {
      const itens = d.itens.map(it => it.id === editingItem.id ? { ...it, ...changes } : it);
      return { ...d, itens };
    });
    setEditingItem(null);
    setTimeout(() => stepAfterItem(), 50);
  };

  const stepAfterItem = () => {
    setDraft(d => {
      const total = calcTotal(d);
      const peso = calcPesoTotal(d.itens);
      const resumo = d.itens.map((it, i) =>
        `${i+1}. ${it.nome} — ${it.qty} × ${BRL(it.unitario)} = *${BRL(it.qty * it.unitario)}*`
      ).join("\n");
      const vol = calcVolumeTotal(d.itens);
      const indId = d.industriaId;
      const pesoInfo = peso > 0 ? `\n⚖️ Peso total: *${KG(peso)}*` : "";
      const volInfo = (vol > 0 && IND_COM_VOLUME.includes(indId)) ? `\n📦 Volume total: *${VOL(vol)}*` : "";
      pushBot({
        id: "np_after",
        text: `📋 *Itens da proposta:*\n\n${resumo}\n\n💰 Subtotal: *${BRL(total)}*${pesoInfo}${volInfo}\n\nO que fazer?`,
        chips: [
          { label: "➕ Adicionar Produto", value: "np_add_item" },
          { label: "✏️ Editar Item", value: "np_choose_edit" },
          { label: "💾 Salvar Agora", value: "np_salvar_rapido" },
          { label: "💳 Pagamento e Frete", value: "np_pagamento" },
          { label: "❌ Cancelar", value: "cancelar_proposta" },
        ]
      });
      return d;
    });
  };

  const saveAndDone = () => {
    setDraft(d => {
      if (!d) return null;
      const final = { ...d, id: d.id || uid(), createdAt: d.createdAt || new Date().toISOString() };
      delete final._pendingProd; delete final._ind;
      saveProposta(final);
      const total = calcTotal(final);
      const peso = calcPesoTotal(final.itens);
      const cli = findCliente(final.clienteId);
      const ind = SEED_DATA.industrias.find(i => i.id === final.industriaId);
      const vol2 = calcVolumeTotal(final.itens);
      const volLine = (vol2 > 0 && IND_COM_VOLUME.includes(final.industriaId)) ? `\n📦 Volume: ${VOL(vol2)}` : "";
      const stepObj = {
        id: "np_done",
        text: `💾 *${final.numero} salva!*\n\n👤 ${cli?.nome || "—"}\n🏭 ${ind?.nome || "—"} · ${final.tabela}\n📦 ${final.itens.length} item(s)\n⚖️ ${KG(peso)}${volLine}\n💰 *${BRL(total)}*${final.valorFrete > 0 ? "\n🚚 Frete: " + BRL(final.valorFrete) : ""}\n📅 Válida até: ${fmtDate(final.validade)}`,
        chips: [
          { label: "🖨 Visualizar PDF", value: "ver_proposta", data: final },
          { label: `${getStatus(final).emoji} Status CRM`, value: "crm_status_menu", data: final },
          { label: "📋 Nova Proposta", value: "new_proposta" },
          { label: "🏠 Menu Inicial", value: "menu" },
        ]
      };
      setTimeout(() => pushBot(stepObj), 0);
      return null;
    });
  };

  const finalizeProposta = (obs) => {
    setDraft(d => {
      if (!d) return null;
      const final = { ...d, obs, id: d.id || uid() };
      delete final._pendingProd; delete final._ind;
      saveProposta(final);
      const total = calcTotal(final);
      const peso = calcPesoTotal(final.itens);
      const cli = findCliente(final.clienteId);
      const ind = SEED_DATA.industrias.find(i => i.id === final.industriaId);
      pushBot({
        id: "np_final",
        text: `🎉 *${final.numero} criada!*\n\n👤 ${cli?.nome || "—"}\n🏭 ${ind?.nome || "—"} · Tabela ${final.tabela}\n📦 ${final.itens.length} item(s)\n⚖️ ${KG(peso)}\n💰 *${BRL(total)}*${final.valorFrete > 0 ? "\n🚚 Frete: " + BRL(final.valorFrete) : ""}\n💳 ${final.pagamento} · ${final.frete}\n📅 Válida até: ${fmtDate(final.validade)}`,
        chips: [
          { label: "🖨 Visualizar PDF", value: "ver_proposta", data: final },
          { label: `${getStatus(final).emoji} Status CRM`, value: "crm_status_menu", data: final },
          { label: "📋 Nova Proposta", value: "new_proposta" },
          { label: "🏠 Menu Inicial", value: "menu" },
        ]
      });
      return null;
    });
  };

  // handle "editar item" — list items as chips
  useEffect(() => {
    if (step?.value === "np_choose_edit" || step?.id === "np_choose_edit") return;
  }, [step]);

  // intercept np_choose_edit
  const processActionWrapped = (action, label, data) => {
    if (action === "np_choose_edit") {
      setDraft(d => {
        if (!d || !d.itens.length) return d;
        pushBot({
          id: "np_choose_edit",
          text: "Qual item deseja editar?",
          chips: [
            ...d.itens.map((it, i) => ({ label: `${i+1}. ${it.nome.slice(0,28)} — ${BRL(it.unitario)}`, value: "np_edit_item", data: it })),
            { label: "❌ Cancelar", value: "cancelar_proposta" },
          ]
        });
        return d;
      });
      return;
    }
    processAction(action, label, data);
  };

  // ── Cadastro screens ─────────────────────────────────────────────────────
  if (showCadastro === "cliente") {
    return <CadastroCliente
      onBack={() => { setShowCadastro(null); pushBot(createWelcomeStep(propostas.length)); }}
      onSave={(cli) => {
        const novo = { ...cli, id: "cc_" + Date.now() };
        setCustomClientes(prev => {
          const updated = [...(Array.isArray(prev) ? prev : []), novo];
          saveCustomClientes(updated);
          _extraClientes = updated;
          return updated;
        });
        setShowCadastro(null);
        pushBot({ id: "cli_saved", text: `✅ Cliente *${novo.nome}* cadastrado!`, chips: [{ label: "➕ Novo Cliente", value: "cadastrar_cliente" }, { label: "📋 Nova Proposta", value: "new_proposta" }, { label: "🏠 Menu Inicial", value: "menu" }] });
      }}
    />;
  }

  if (showCadastro === "produto") {
    return <CadastroProduto
      industrias={SEED_DATA.industrias}
      onBack={() => { setShowCadastro(null); pushBot(createWelcomeStep(propostas.length)); }}
      onSave={(prod) => {
        const novo = { ...prod, id: "cp_" + Date.now() };
        setCustomProdutos(prev => {
          const updated = [...prev, novo];
          saveCustomProdutos(updated);
          _extraProdutos = updated;
          return updated;
        });
        setShowCadastro(null);
        pushBot({ id: "prod_saved", text: `✅ Produto *${novo.nome}* cadastrado!`, chips: [{ label: "➕ Novo Produto", value: "cadastrar_produto" }, { label: "📋 Nova Proposta", value: "new_proposta" }, { label: "🏠 Menu Inicial", value: "menu" }] });
      }}
    />;
  }

  // ── Backup modal ─────────────────────────────────────────────────────────
  if (showBackup) {
    const json = JSON.stringify(propostas, null, 2);
    return (
      <div style={{ display:"flex", flexDirection:"column", height:"100vh", background:"#f0f2f5", fontFamily:"'Inter', system-ui, sans-serif" }}>
        <div style={{ ...S.header, justifyContent:"space-between" }}>
          <button onClick={() => setShowBackup(false)} style={S.printBack}>← Voltar</button>
          <span style={{ color:"#1e293b", fontSize:14, fontWeight:600 }}>Backup — {propostas.length} proposta(s)</span>
          <div style={{ width:60 }} />
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:24, display:"flex", flexDirection:"column", gap:12, background:"#f0f2f5" }}>
          <div style={{ background:"#f1f5f9", borderRadius:8, padding:12, fontSize:13, color:"#475569", lineHeight:1.6 }}>
            <strong style={{ color:"#1e293b" }}>Como salvar:</strong><br/>
            1. Selecione todo o texto abaixo (toque e segure → Selecionar Tudo)<br/>
            2. Copie (Copiar)<br/>
            3. Cole num app de notas ou envie por WhatsApp para você mesmo<br/>
            4. Na próxima sessão, use ⬆️ para importar
          </div>
          <div style={{ background:"#fff", borderRadius:8, padding:12, border:"1px solid #e2e8f0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
              <span style={{ color:"#16a34a", fontSize:12, fontWeight:600 }}>JSON — {propostas.length} proposta(s)</span>
              <button onClick={() => {
                if (navigator.clipboard) {
                  navigator.clipboard.writeText(json).then(() => alert("Copiado!"));
                } else {
                  const ta = document.querySelector("#backup-ta");
                  ta.select(); document.execCommand("copy"); alert("Copiado!");
                }
              }} style={{ background:"#2563eb", border:"none", color:"#fff", borderRadius:6, padding:"4px 12px", fontSize:12, cursor:"pointer" }}>
                📋 Copiar
              </button>
            </div>
            <textarea id="backup-ta" readOnly value={json}
              style={{ width:"100%", height:300, background:"#f8fafc", color:"#0f172a", border:"none", fontSize:11, fontFamily:"monospace", resize:"none", outline:"none", lineHeight:1.5 }} />
          </div>
        </div>
      </div>
    );
  }

  // ── Print view ──────────────────────────────────────────────────────────
  if (showPrint) {
    const alreadySaved = propostas.find(p => p.id === showPrint.id);
    const handleSaveFromPrint = !alreadySaved ? () => {
      saveProposta(showPrint);
      const p = showPrint;
      setShowPrint(null);
      pushBot({
        id: "sfp",
        text: `💾 *${p.numero}* salva!`,
        chips: [
          { label: "🖨 Visualizar PDF", value: "ver_proposta", data: p },
          { label: "📋 Nova Proposta", value: "new_proposta" },
          { label: "🔍 Buscar Propostas", value: "search_propostas" },
          { label: "🏠 Menu Inicial", value: "menu" },
        ]
      });
    } : null;
    const handleBack = () => {
      setShowPrint(null);
      const p = showPrint;
      const cli = findCliente(p.clienteId);
      pushBot({
        id: "back_from_print",
        text: `← Voltando para *${p.numero}*${cli ? " · " + cli.nome.slice(0,30) : ""}\n\nO que deseja fazer?`,
        chips: [
          { label: "💾 Salvar Proposta", value: "salvar_proposta", data: p },
          { label: "🖨 Visualizar PDF", value: "ver_proposta", data: p },
          { label: "✏️ Editar Proposta", value: "editar_proposta", data: p },
          { label: `${getStatus(p).emoji} Status: ${getStatus(p).label}`, value: "crm_status_menu", data: p },
          { label: "📤 Marcar Enviada", value: "status_proposta", data: { id: p.id, status: "enviada" } },
          { label: "✅ Marcar Aprovada", value: "status_proposta", data: { id: p.id, status: "aprovada" } },
          { label: "📋 Nova Proposta", value: "new_proposta" },
          { label: "🔍 Buscar Propostas", value: "search_propostas" },
          { label: "🏠 Menu Inicial", value: "menu" },
        ]
      });
    };
    return <PrintView proposta={showPrint} onBack={handleBack} onSave={handleSaveFromPrint} allPropostas={propostas} onBackup={() => { setShowPrint(null); setShowBackup(true); }} />;
  }

  // ── KPI computations ────────────────────────────────────────────────────────
  const hoje = new Date();
  const msDay = 86400000;
  const propAberto   = propostas.filter(p => !["aprovada","recusada"].includes(p.status) && !["ganha","perdida"].includes(p.crm_status));
  const propQuente   = propostas.filter(p => p.crm_status === "quente");
  const propMorna    = propostas.filter(p => p.crm_status === "morna");
  const propFria     = propostas.filter(p => p.crm_status === "fria");
  const propPerdidas = propostas.filter(p => p.status === "recusada" || p.crm_status === "perdida");
  const propUrgente = propostas.filter(p => {
    if (!p.validade) return false;
    const dias = Math.round((new Date(p.validade) - hoje) / msDay);
    return dias < 0 && !["aprovada","recusada"].includes(p.status);
  });
  const propAprovadas = propostas.filter(p => {
    if (p.status !== "aprovada") return false;
    const mes = new Date(); mes.setDate(1);
    return new Date(p.data) >= mes;
  });
  const totalAberto = propAberto.reduce((s, p) => s + calcTotal(p), 0);

  const getDias = (p) => {
    if (!p.data) return 0;
    return Math.round((hoje - new Date(p.data)) / msDay);
  };

  const getCardBorderColor = (p) => {
    if (p.status === "aprovada") return "#22c55e";
    if (p.status === "recusada") return "#94a3b8";
    const dias = getDias(p);
    if (dias > 7) return "#ef4444";
    if (dias > 3) return "#f59e0b";
    return "#3b82f6";
  };

  // Tab filtering
  const dashPropostas = (() => {
    const sorted = [...propostas].sort((a,b) => (b.numero||"").localeCompare(a.numero||""));
    if (dashTab === "followup")  return sorted.filter(p => !["aprovada","recusada","ganha","perdida"].includes(p.crm_status) && !["aprovada","recusada"].includes(p.status));
    if (dashTab === "quente")    return sorted.filter(p => p.crm_status === "quente");
    if (dashTab === "morna")     return sorted.filter(p => p.crm_status === "morna");
    if (dashTab === "fria")      return sorted.filter(p => p.crm_status === "fria");
    if (dashTab === "aprovadas") return sorted.filter(p => p.status === "aprovada" || p.crm_status === "ganha");
    if (dashTab === "perdidas")  return sorted.filter(p => p.status === "recusada" || p.crm_status === "perdida");
    return sorted;
  })();


  // ── Supabase sync handlers ──────────────────────────────────────────────────
  const handleSyncSave = async () => {
    setSyncStatus("saving");
    try {
      await sbSaveAll(propostas, customClientes, customProdutos);
      setSyncStatus("ok");
    } catch(e) { setSyncStatus("err:" + (e.message || "Erro")); }
    setTimeout(() => setSyncStatus(""), 4000);
  };

  const handleSyncLoad = async () => {
    setSyncStatus("loading");
    try {
      const data = await sbLoadAll();
      if (!data.propostas.length) { setSyncStatus("err:Nenhuma proposta no servidor"); setTimeout(() => setSyncStatus(""), 4000); return; }
      setPropostas(data.propostas); savePropostas(data.propostas);
      if (data.clientes?.length) { setCustomClientes(data.clientes); saveCustomClientes(data.clientes); _extraClientes = data.clientes; }
      if (data.produtos?.length) { setCustomProdutos(data.produtos); saveCustomProdutos(data.produtos); _extraProdutos = data.produtos; }
      setSyncStatus("ok");
    } catch(e) { setSyncStatus("err:" + (e.message || "Erro")); }
    setTimeout(() => setSyncStatus(""), 4000);
  };

  // Auto-save to Supabase whenever propostas change
  useEffect(() => {
    if (propostas.length > 0) {
      sbSaveAll(propostas, customClientes, customProdutos).catch(() => {});
    }
  }, [propostas]);
  // ─────────────────────────────────────────────────────────────────────────────

  // ── Render ──────────────────────────────────────────────────────────────────
  const activeChips = step?.chips || [];
  const activeInputMode = step?.inputMode || null;

  return (
    <div style={S.root}>

      {/* ── LEFT: Chat panel ── */}
      <div style={S.chatPanel}>
        {/* Chat header */}
        <div style={S.header}>
          <div style={S.headerAvatar}>CR</div>
          <div style={{ flex:1 }}>
            <div style={S.headerName}>Chazan Representações</div>
            <div style={S.headerSub}>{propostas.length} proposta(s)</div>
          </div>
          <div style={{ display:"flex", gap:5 }}>
            {/* Sync status */}
            {syncStatus && (
              <span style={{ fontSize:11, fontWeight:600,
                color: syncStatus==="ok" ? "#16a34a" : syncStatus==="saving"||syncStatus==="loading" ? "#f59e0b" : "#ef4444",
                maxWidth:120, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                {syncStatus==="saving" ? "⏫ Salvando..." : syncStatus==="loading" ? "⏬ Carregando..." : syncStatus==="ok" ? "✅ Sincronizado" : "❌ " + syncStatus.replace("err:","")}
              </span>
            )}
            {/* Sync to Supabase */}
            <button title="Enviar para nuvem" style={{ ...S.headerBtn, background: syncStatus==="saving" ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.15)" }}
              disabled={syncStatus==="saving"||syncStatus==="loading"}
              onClick={handleSyncSave}>☁️⬆️</button>
            <button title="Receber da nuvem" style={{ ...S.headerBtn, background: syncStatus==="loading" ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.15)" }}
              disabled={syncStatus==="saving"||syncStatus==="loading"}
              onClick={handleSyncLoad}>☁️⬇️</button>
            <button title="Exportar" style={S.headerBtn} onClick={() => {
              const data = JSON.stringify({ propostas, clientes: customClientes, produtos: customProdutos }, null, 2);
              const blob = new Blob([data], { type:"application/json" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url; a.download = `chazan_backup_${new Date().toISOString().slice(0,10)}.json`;
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(url), 3000);
            }}>⬇️</button>
            <label title="Importar" style={S.headerBtn}>
              ⬆️
              <input type="file" accept=".json" style={{ display:"none" }} onChange={(e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                  try {
                    const data = JSON.parse(ev.target.result);
                    const lista = Array.isArray(data) ? data : (data.propostas || []);
                    if (lista.length > 0) {
                      setPropostas(lista); savePropostas(lista);
                      if (data.clientes?.length) { setCustomClientes(data.clientes); saveCustomClientes(data.clientes); _extraClientes = data.clientes; }
                      if (data.produtos?.length) { setCustomProdutos(data.produtos); saveCustomProdutos(data.produtos); _extraProdutos = data.produtos; }
                      pushBot({ id:"imported", text:`✅ ${lista.length} proposta(s) importada(s)!`, chips:[{ label:"🔍 Buscar Propostas", value:"search_propostas" },{ label:"🏠 Menu Inicial", value:"menu" }] });
                    }
                  } catch(_) { alert("Arquivo inválido"); }
                  e.target.value = "";
                };
                reader.readAsText(file);
              }} />
            </label>
          </div>
        </div>

        {/* Messages */}
        <div style={S.messages}>
          {msgs.map(msg => <MessageBubble key={msg.id} msg={msg} onAction={(c) => processActionWrapped(c.value, c.label, c.data)} />)}
          <div ref={bottomRef} />
        </div>

        {/* Chips */}
        {activeChips.length > 0 && (
          <div style={S.chipsBar}>
            {activeChips.map((chip, i) => (
              <button key={i} onClick={() => { pushUser(chip.label); processActionWrapped(chip.value, chip.label, chip.data); }} style={S.chip}>
                {chip.label}
              </button>
            ))}
          </div>
        )}

        {/* Input */}
        {(activeInputMode || !activeChips.length) && (
          <div style={S.inputBar}>
            <input
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handleSend()}
              placeholder={activeInputMode === "date" ? "DD/MM/AAAA…" : "Digite…"}
              style={S.input} autoFocus />
            <button onClick={handleSend} style={S.sendBtn}>➤</button>
          </div>
        )}
      </div>

      {/* ── RIGHT: Dashboard panel ── */}
      <div style={S.dashPanel}>
        {/* Dashboard header */}
        <div style={S.dashHeader}>
          <div>
            <div style={S.dashTitle}>Painel de Propostas</div>
            <div style={S.dashSub}>{new Date().toLocaleDateString("pt-BR", { weekday:"long", day:"numeric", month:"long" })}</div>
          </div>
          <button
            onClick={() => processActionWrapped("new_proposta", "Nova Proposta", null)}
            style={{ padding:"9px 18px", background:"#1a5276", color:"#fff", border:"none", borderRadius:10, fontSize:13, fontWeight:700, cursor:"pointer" }}
          >+ Nova Proposta</button>
        </div>

        {/* KPIs */}
        <div style={S.kpiRow}>
          <div style={{ ...S.kpiCard, cursor:"pointer" }} onClick={() => setDashTab("followup")}>
            <div style={{ ...S.kpiNum, color:"#f59e0b" }}>{propAberto.length}</div>
            <div style={S.kpiLabel}>Em aberto</div>
            <div style={S.kpiSub}>{propQuente.length > 0 ? `🔥 ${propQuente.length} quente(s)` : BRL(totalAberto)}</div>
          </div>
          <div style={{ ...S.kpiCard, cursor:"pointer" }} onClick={() => setDashTab("followup")}>
            <div style={{ ...S.kpiNum, color:"#ef4444" }}>{propUrgente.length}</div>
            <div style={S.kpiLabel}>Vencidas</div>
            <div style={S.kpiSub}>prazo ultrapassado</div>
          </div>
          <div style={{ ...S.kpiCard, cursor:"pointer" }} onClick={() => setDashTab("aprovadas")}>
            <div style={{ ...S.kpiNum, color:"#22c55e" }}>{propAprovadas.length}</div>
            <div style={S.kpiLabel}>Aprovadas</div>
            <div style={S.kpiSub}>este mês</div>
          </div>
          <div style={{ ...S.kpiCard, cursor:"pointer" }} onClick={() => setDashTab("todas")}>
            <div style={{ ...S.kpiNum, color:"#3b82f6" }}>{propostas.length}</div>
            <div style={S.kpiLabel}>Total</div>
            <div style={S.kpiSub}>todas as propostas</div>
          </div>
        </div>

        {/* Tabs */}
        <div style={S.tabsRow}>
          {[
            { key:"followup",  label:"🔔 Follow-up",  count: propAberto.length },
            { key:"quente",    label:"🔥 Quentes",    count: propQuente.length },
            { key:"morna",     label:"🌡️ Mornas",     count: propMorna.length },
            { key:"fria",      label:"🧊 Frias",      count: propFria.length },
            { key:"aprovadas", label:"✅ Aprovadas",  count: propAprovadas.length },
            { key:"perdidas",  label:"❌ Perdidas",   count: propPerdidas.length },
            { key:"todas",     label:"📋 Todas",      count: propostas.length },
          ].map(t => (
            <button key={t.key} style={{ ...S.tab, ...(dashTab===t.key ? S.tabActive : {}) }}
              onClick={() => setDashTab(t.key)}>
              {t.label}
              {t.count > 0 && (
                <span style={{
                  marginLeft:6, background: dashTab===t.key ? "#1a5276" : "#e2e8f0",
                  color: dashTab===t.key ? "#fff" : "#64748b",
                  fontSize:11, fontWeight:700, borderRadius:10,
                  padding:"1px 7px", display:"inline-block"
                }}>{t.count}</span>
              )}
            </button>
          ))}
        </div>

        {/* Proposal cards */}
        <div style={S.dashContent}>
          {dashPropostas.length === 0 ? (
            <div style={{ textAlign:"center", color:"#94a3b8", marginTop:60, fontSize:14 }}>
              <div style={{ fontSize:40, marginBottom:12 }}>📭</div>
              {dashTab === "followup" ? "Nenhuma proposta pendente." : "Nenhuma proposta aqui."}
            </div>
          ) : (
            <>
              <div style={S.dashSectionLabel}>{dashPropostas.length} proposta(s)</div>
              {dashPropostas.map(p => {
                const cli = findCliente(p.clienteId);
                const ind = SEED_DATA.industrias.find(i => i.id === p.industriaId);
                const total = calcTotal(p);
                const dias = getDias(p);
                const borderColor = getCardBorderColor(p);
                const isUrgente = dias > 7 && !["aprovada","recusada"].includes(p.status);
                return (
                  <div key={p.id} style={{ ...S.propCard, borderLeftColor: borderColor }}>
                    <div style={S.propCardRow}>
                      <div>
                        <div style={S.propCardName}>{cli?.nome || "—"}</div>
                        <div style={S.propCardNum}>{p.numero}</div>
                        {ind && <div style={S.propCardInd}>🏭 {ind.nome}{p.tabela ? ` · ${p.tabela}` : ""}</div>}
                        {p.crm_status && p.crm_status !== "rascunho" && (() => {
                          const st = STATUS[p.crm_status];
                          return st ? <div style={{ fontSize:11, marginTop:3, color: st.color, fontWeight:600 }}>{st.emoji} {st.label}</div> : null;
                        })()}
                      </div>
                      <div>
                        <div style={S.propCardValue}>{BRL(total)}</div>
                        <div style={{ ...S.propCardDays, color: borderColor }}>
                          {p.status === "aprovada" ? "✅ Aprovada" :
                           p.status === "recusada" ? "❌ Recusada" :
                           isUrgente ? `${dias}D VENCIDA` :
                           dias === 0 ? "hoje" : `${dias}D em aberto`}
                        </div>
                      </div>
                    </div>
                    <div style={S.propCardBtns}>
                      <button style={S.propBtnGhost} onClick={() => processActionWrapped("ver_proposta","Ver",p)}>🖨 Ver PDF</button>
                      <button style={S.propBtnGhost} onClick={() => processActionWrapped("editar_proposta","Editar",p)}>✏️ Editar</button>
                      <button style={{ ...S.propBtnGhost, fontSize:11, flex:"none", padding:"7px 10px" }}
                        onClick={() => processActionWrapped("crm_status_menu","CRM",p)}>📊 CRM</button>
                      {p.status !== "aprovada" && p.crm_status !== "ganha" && (
                        <button style={S.propBtnGreen} onClick={() => processActionWrapped("status_proposta","Aprovar",{ id:p.id, status:"aprovada" })}>✓ Aprovar</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      </div>

    </div>
  );
}

// ── MessageBubble ─────────────────────────────────────────────────────────────
function MessageBubble({ msg, onAction }) {
  const isBot = msg.from === "bot";

  const renderText = (text) => {
    if (!text) return null;
    return text.split("\n").map((line, li, arr) => (
      <span key={li}>
        {line.split(/(\*[^*]+\*)/).map((p, i) =>
          p.startsWith("*") && p.endsWith("*") ? <strong key={i}>{p.slice(1,-1)}</strong> : p
        )}
        {li < arr.length - 1 && <br />}
      </span>
    ));
  };

  if (msg.type === "proposta_list") {
    return (
      <div style={{ ...S.bubble, ...S.botBubble, maxWidth: "95%" }}>
        {!msg.propostas?.length
          ? <span style={{ color: "#94a3b8" }}>Nenhuma proposta ainda.</span>
          : msg.propostas.map(p => {
              const cli = findCliente(p.clienteId);
              const ind = SEED_DATA.industrias.find(i => i.id === p.industriaId);
              const total = calcTotal(p);
              const peso = calcPesoTotal(p.itens);
              return (
                <div key={p.id} style={S.propostaCard}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <span style={S.propostaNum}>{p.numero}</span>
                    <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                      <span style={{ ...S.statusBadge, background: (STATUS_COLORS[p.status]||"#94a3b8")+"33", color: STATUS_COLORS[p.status]||"#94a3b8" }}>{p.status}</span>
                      <span
                        onClick={() => handleChip({ label: `${getStatus(p).emoji} Status CRM`, value: "crm_status_menu", data: p })}
                        style={{ cursor:"pointer", fontSize:13, background:"#f1f5f9", border:"1px solid #e2e8f0", borderRadius:6, padding:"2px 8px", color: getStatus(p).color }}
                      >{getStatus(p).emoji} {getStatus(p).label}</span>
                    </div>
                  </div>
                  <div style={S.propostaCli}>{cli?.nome || "—"}</div>
                  {ind && (
                    <div style={{ fontSize:11, color:"#64748b", marginTop:1 }}>
                      🏭 {ind.nome}{p.tabela ? ` · ${p.tabela}` : ""}
                    </div>
                  )}
                  <div style={{ display:"flex", gap:12, alignItems:"baseline", flexWrap:"wrap", marginTop:2 }}>
                    <div style={S.propostaTotal}>{BRL(total)}</div>
                    {peso > 0 && <div style={{ color:"#94a3b8", fontSize:11 }}>⚖️ {KG(peso)}</div>}
                    {p.validade && <div style={{ color:"#94a3b8", fontSize:11 }}>📅 {fmtDate(p.validade)}</div>}
                  </div>
                  {p.valorFrete > 0 && <div style={{ color:"#64748b", fontSize:11, marginTop:2 }}>🚚 Frete: {BRL(p.valorFrete)}</div>}
                  <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap" }}>
                    <button style={S.cardBtn} onClick={() => onAction({ value:"ver_proposta", label:"Ver", data:p })}>🖨 Ver</button>
                    <button style={{...S.cardBtn, color:"#fbbf24"}} onClick={() => onAction({ value:"editar_proposta", label:"Editar", data:p })}>✏️ Editar</button>
                    <button style={{...S.cardBtn, color:"#a78bfa"}} onClick={() => onAction({ value:"crm_status_menu", label:"CRM", data:p })}>📊 {getStatus(p).emoji}</button>
                    {["enviada","aprovada","recusada"].map(s => (
                      <button key={s} style={{...S.cardBtn, opacity: p.status===s ? 0.4 : 1}}
                        onClick={() => onAction({ value:"status_proposta", label:s, data:{ id:p.id, status:s } })}>
                        {s==="enviada"?"📤":s==="aprovada"?"✅":"❌"} {s}
                      </button>
                    ))}
                    <button style={{...S.cardBtn, color:"#f87171"}} onClick={() => onAction({ value:"excluir_proposta", label:"Excluir", data:p })}>🗑</button>
                  </div>
                </div>
              );
            })
        }
      </div>
    );
  }

  if (msg.type === "cliente_cards") {
    return (
      <div style={{ ...S.bubble, ...S.botBubble, maxWidth: "95%" }}>
        <div style={{ marginBottom:8, fontSize:13, color:"#94a3b8" }}>{msg.text}</div>
        {msg.items.map(c => (
          <div key={c.id} style={S.clienteCard}>
            <div style={{ fontWeight:700, fontSize:13 }}>{c.nome}</div>
            <div style={{ fontSize:11, color:"#94a3b8" }}>{c.cnpj} · {c.cidade}</div>
            {c.fone && <div style={{ fontSize:11, color:"#64748b" }}>📞 {c.fone}</div>}
            {c.email && <div style={{ fontSize:11, color:"#64748b" }}>✉ {c.email}</div>}
          </div>
        ))}
      </div>
    );
  }

  if (msg.type === "produto_cards") {
    return (
      <div style={{ ...S.bubble, ...S.botBubble, maxWidth: "95%" }}>
        <div style={{ marginBottom:8, fontSize:13, color:"#94a3b8" }}>{msg.text}</div>
        {msg.items.map(p => {
          const ind = SEED_DATA.industrias.find(i => i.id === p.industriaId);
          return (
            <div key={p.id} style={S.clienteCard}>
              <div style={{ fontWeight:700, fontSize:13 }}>{p.nome}</div>
              <div style={{ fontSize:11, color:"#94a3b8" }}>{p.codigo} · {p.unidade} · {ind?.nome}</div>
              <div style={{ fontSize:13, fontWeight:700, color:"#4ade80", marginTop:2 }}>{BRL(p.preco)}</div>
              {p.peso_unit > 0 && <div style={{ fontSize:11, color:"#64748b" }}>⚖️ {p.peso_unit} kg/un</div>}
            </div>
          );
        })}
      </div>
    );
  }

  return (
    <div style={{ display:"flex", justifyContent:isBot?"flex-start":"flex-end", marginBottom:6 }}>
      {isBot && <div style={S.botAvatar}>CR</div>}
      <div style={{ ...S.bubble, ...(isBot ? S.botBubble : S.userBubble) }}>
        {renderText(msg.text)}
      </div>
    </div>
  );
}

// ── PrintView ─────────────────────────────────────────────────────────────────
function PrintView({ proposta: p, onBack, onSave, allPropostas, onBackup }) {
  const [showInfo, setShowInfo] = React.useState(false);
  const cli = findCliente(p.clienteId) || {};
  const ind = SEED_DATA.industrias.find(i => i.id === p.industriaId) || {};
  const total = calcTotal(p);
  const peso = calcPesoTotal(p.itens);

  const handlePDF = () => {
    // Build full HTML document for PDF generation
    const rows = p.itens.map((it, i) => `
      <tr style="background:${i%2===0?"#f8fafc":"#fff"}">
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0">${i+1}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0">${it.nome}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0">${it.codigo||"—"}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:center">${it.unidade}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:right">${it.qty}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:right">${BRL(it.unitario)}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:right;font-weight:600">${BRL(it.qty*it.unitario)}</td>
        <td style="padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:right;color:#64748b">${it.peso_unit>0?(it.peso_unit*it.qty).toFixed(2)+"kg":"—"}</td>
      </tr>`).join("");

    const descontoRow = p.desconto > 0 ? `
      <tr>
        <td colspan="6" style="padding:6px 8px;text-align:right;color:#64748b">Desconto (${p.desconto}%)</td>
        <td style="padding:6px 8px;text-align:right;color:#dc2626">- ${BRL(calcTotal({...p,desconto:0})*p.desconto/100)}</td>
        <td></td>
      </tr>` : "";

    const freteRow = p.valorFrete > 0 ? `
      <tr>
        <td colspan="6" style="padding:6px 8px;text-align:right;color:#64748b">🚚 Custo do Frete (${p.frete})</td>
        <td style="padding:6px 8px;text-align:right;color:#64748b;font-weight:600">${BRL(p.valorFrete)}</td>
        <td></td>
      </tr>` : "";

    const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>${p.numero} - Chazan Representações</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, sans-serif; font-size: 13px; color: #1e293b; padding: 32px; }
  @media print { body { padding: 16px; } }
  .cond-label { font-weight: 700; color: #374151; }
</style>
</head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
    <div>
      <img src="${LOGO_B64}" style="height:40px;width:auto;object-fit:contain;" alt="Chazan Representações" />
      ${getIndLogo(p.industriaId) ? `<br/><img src="${getIndLogo(p.industriaId)}" style="height:40px;width:auto;object-fit:contain;" alt="${ind.nome}" />` : ''}
      <div style="font-size:11px;color:#64748b;margin-top:2px">Proposta Comercial</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:20px;font-weight:700;color:#2563eb">${p.numero}</div>
      <div style="font-size:12px;color:#64748b">${fmtDate(p.data)}</div>
      ${p.validade ? `<div style="font-size:12px;color:#dc2626;font-weight:600">Válida até ${fmtDate(p.validade)}</div>` : ""}
    </div>
  </div>
  <div style="height:3px;background:#0f172a;margin-bottom:16px"></div>
  <div style="display:flex;gap:32px;margin-bottom:20px">
    <div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:1px;margin-bottom:4px">Cliente</div>
      <div style="font-size:15px;font-weight:700">${cli.nome||"—"}</div>
      ${cli.cnpj ? `<div style="font-size:12px;color:#475569">CNPJ: ${cli.cnpj}</div>` : ""}
      ${cli.cidade ? `<div style="font-size:12px;color:#475569">${cli.cidade}</div>` : ""}
      ${cli.fone ? `<div style="font-size:12px;color:#475569">Tel: ${cli.fone}</div>` : ""}
    </div>
    <div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:1px;margin-bottom:4px">Indústria / Tabela</div>
      <div style="font-size:14px;font-weight:700">${ind.nome||"—"}</div>
      ${p.tabela ? `<div style="font-size:12px;color:#475569">Tabela ${p.tabela}</div>` : ""}
      ${p.tabela ? `<div style="font-size:12px;color:#475569">${ind.nome} ${p.tabela.charAt(0).toUpperCase()+p.tabela.slice(1)}</div>` : ""}
    </div>
  </div>
  <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px">
    <thead>
      <tr style="background:#0f172a;color:#fff">
        <th style="padding:7px 8px;text-align:left">#</th>
        <th style="padding:7px 8px;text-align:left">Produto</th>
        <th style="padding:7px 8px;text-align:left">Cód.</th>
        <th style="padding:7px 8px;text-align:center">Un.</th>
        <th style="padding:7px 8px;text-align:right">Qtd</th>
        <th style="padding:7px 8px;text-align:right">Unitário</th>
        <th style="padding:7px 8px;text-align:right">Subtotal</th>
        <th style="padding:7px 8px;text-align:right">Peso</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
    <tfoot>
      ${descontoRow}
      <tr>
        <td colspan="6" style="padding:7px 8px;text-align:right;font-weight:700">TOTAL</td>
        <td style="padding:7px 8px;text-align:right;font-weight:700;font-size:15px">${BRL(total)}</td>
        <td style="padding:7px 8px;text-align:right;color:#64748b;font-weight:600">${peso>0?KG(peso):"—"}</td>
      </tr>
      ${IND_COM_VOLUME.includes(p.industriaId) && calcVolumeTotal(p.itens)>0 ? `<tr><td colspan="8" style="padding:7px 8px;text-align:right;color:#2563eb;font-weight:600">Volume Total</td><td style="padding:7px 8px;text-align:right;color:#2563eb;font-weight:700">${VOL(calcVolumeTotal(p.itens))}</td></tr>` : ""}
      ${freteRow}
    </tfoot>
  </table>
  <div style="font-size:12px;color:#475569;margin-bottom:12px;display:flex;gap:32px;flex-wrap:wrap">
    ${p.pagamento ? `<span><span class="cond-label">Pagamento:</span> ${p.pagamento}</span>` : ""}
    ${p.frete ? `<span><span class="cond-label">Frete:</span> ${p.frete}</span>` : ""}
  </div>
  ${p.obs ? `<div style="background:#f8fafc;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:12px"><strong>Observações:</strong> ${p.obs}</div>` : ""}
  <div style="border-top:1px solid #e2e8f0;padding-top:10px;font-size:11px;color:#94a3b8;text-align:center">
    Chazan Representações · ${p.numero} · ${p.status}
  </div>
  <script>window.onload=()=>{ window.print(); }<\/script>
</body></html>`;

    // Download as HTML file - user opens it and prints to PDF
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${p.numero}_Chazan_Representacoes.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setShowInfo(true);
  };

  const handleWhatsApp = () => {
    const cli = findCliente(p.clienteId) || {};
    const ind = SEED_DATA.industrias.find(i => i.id === p.industriaId) || {};
    const total = calcTotal(p);

    const itensResumo = p.itens.map((it, i) =>
      `  ${i+1}. ${it.nome} — ${it.qty} ${it.unidade} x ${BRL(it.unitario)} = ${BRL(it.qty * it.unitario)}`
    ).join("\n");

    const msg = [
      `*Proposta ${p.numero} - Chazan Representações*`,
      ``,
      `*Cliente:* ${cli.nome || "—"}`,
      cli.cnpj ? `*CNPJ:* ${cli.cnpj}` : "",
      ``,
      `*Indústria:* ${ind.nome || "—"} (${p.tabela || "—"})`,
      ``,
      `*Itens:*`,
      itensResumo,
      ``,
      `*Total: ${BRL(total)}*`,
      p.valorFrete > 0 ? `*Frete: ${BRL(p.valorFrete)}*` : "",
      ``,
      p.pagamento ? `*Pagamento:* ${p.pagamento}` : "",
      p.frete ? `*Frete:* ${p.frete}` : "",
      p.validade ? `*Validade:* ${fmtDate(p.validade)}` : "",
      p.obs ? `*Obs:* ${p.obs}` : "",
      ``,
      `_Chazan Representacoes - Construcao Inteligente_`,
    ].filter(Boolean).join("\n");

    const url = `https://wa.me/5548999011001?text=${encodeURIComponent(msg)}`;
    window.open(url, "_blank");
  };;

  return (
    <div style={S.printRoot}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 16px", background:"#0f172a" }}>
        <button onClick={onBack} style={S.printBack}>← Voltar</button>
        <span style={{ color:"#94a3b8", fontSize:14 }}>{p.numero}</span>
        <div style={{ display:"flex", gap:8 }}>
          {onSave && <button onClick={onSave} style={{ ...S.printBtn, background:"#16a34a" }}>💾 Salvar Proposta</button>}
          {!onSave && <button style={{ ...S.printBtn, background:"#16a34a", opacity:0.5, cursor:"default" }}>✅ Salva</button>}
          <button onClick={handleWhatsApp} style={{ ...S.printBtn, background:"#25d366" }}>📲 WhatsApp</button>
          <button onClick={handlePDF} style={S.printBtn}>📄 Salvar PDF</button>
        </div>
      </div>

      {showInfo && (
        <div style={{ background:"#1e40af", color:"#fff", padding:"10px 16px", fontSize:13, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span>📥 Arquivo baixado! Abra-o no navegador e use <strong>Ctrl+P → Salvar como PDF</strong></span>
          <button onClick={() => setShowInfo(false)} style={{ background:"none", border:"none", color:"#93c5fd", cursor:"pointer", fontSize:16 }}>✕</button>
        </div>
      )}
      <div style={S.printDoc}>
        {/* Header */}
        {(() => {
          const indLogo = getIndLogo(p.industriaId);
          return (
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                <img src={LOGO_B64} style={{ height:40, width:"auto", objectFit:"contain" }} alt="Chazan Representações" />
                {indLogo && (
                  <img src={indLogo} style={{ height:40, width:"auto", objectFit:"contain" }} alt={ind.nome} />
                )}
                <div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>Proposta Comercial</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:20, fontWeight:700, color:"#2563eb" }}>{p.numero}</div>
                <div style={{ fontSize:12, color:"#64748b" }}>{fmtDate(p.data)}</div>
                {p.validade && <div style={{ fontSize:12, color:"#dc2626", fontWeight:600 }}>Válida até {fmtDate(p.validade)}</div>}
              </div>
            </div>
          );
        })()}

        <div style={{ height:2, background:"#0f172a", margin:"0 0 16px" }} />

        {/* Cliente + Indústria */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
          <div>
            <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", color:"#64748b", letterSpacing:1 }}>Cliente</div>
            <div style={{ fontSize:16, fontWeight:700 }}>{cli.nome || "—"}</div>
            {cli.cnpj && <div style={{ fontSize:12, color:"#475569" }}>CNPJ: {cli.cnpj}</div>}
            {cli.cidade && <div style={{ fontSize:12, color:"#475569" }}>{cli.cidade}</div>}
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", color:"#64748b", letterSpacing:1 }}>Indústria / Tabela</div>
            {!getIndLogo(p.industriaId) && <div style={{ fontSize:14, fontWeight:700 }}>{ind.nome || "—"}</div>}
            {p.tabela && <div style={{ fontSize:12, color:"#475569" }}>Tabela {p.tabela}</div>}
            {!getIndLogo(p.industriaId) && ind.nome && p.tabela && <div style={{ fontSize:12, color:"#475569" }}>{ind.nome} {p.tabela.charAt(0).toUpperCase() + p.tabela.slice(1)}</div>}
          </div>
        </div>

        {/* Itens */}
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12, marginBottom:16 }}>
          <thead>
            <tr>
              {["#","Produto","Cód.","Un.","Qtd","Unitário","Subtotal","Peso (kg)",...(IND_COM_VOLUME.includes(p.industriaId)?["Vol.(m³)"]:[])] .map(h => (
                <th key={h} style={{ background:"#0f172a", color:"#fff", padding:"7px 8px", textAlign: ["Qtd","Unitário","Subtotal","Peso (kg)","Vol.(m³)"].includes(h) ? "right" : "left", fontSize:11 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {p.itens.map((it, i) => (
              <tr key={it.id} style={{ background: i%2===0 ? "#f8fafc" : "#fff" }}>
                <td style={S.td}>{i+1}</td>
                <td style={S.td}>{it.nome}</td>
                <td style={S.td}>{it.codigo || "—"}</td>
                <td style={S.td}>{it.unidade}</td>
                <td style={{ ...S.td, textAlign:"right" }}>{it.qty}</td>
                <td style={{ ...S.td, textAlign:"right" }}>{BRL(it.unitario)}</td>
                <td style={{ ...S.td, textAlign:"right", fontWeight:600 }}>{BRL(it.qty * it.unitario)}</td>
                <td style={{ ...S.td, textAlign:"right", color:"#64748b" }}>{it.peso_unit > 0 ? (it.peso_unit * it.qty).toFixed(2) : "—"}</td>
                {IND_COM_VOLUME.includes(p.industriaId) && (() => { const pr = findProduto(it.produtoId)||it; const v=Number(pr.volume_emb)||0; return <td style={{...S.td,textAlign:"right",color:"#64748b"}}>{v>0?((v*it.qty).toFixed(4)):"—"}</td>; })()}
              </tr>
            ))}
          </tbody>
          <tfoot>
            {p.desconto > 0 && (
              <tr>
                <td colSpan={6} style={{ ...S.td, textAlign:"right", color:"#64748b" }}>Desconto ({p.desconto}%)</td>
                <td style={{ ...S.td, textAlign:"right", color:"#dc2626" }}>- {BRL(calcTotal({...p, desconto:0}) * p.desconto / 100)}</td>
                <td style={S.td} />
              </tr>
            )}
            <tr>
              <td colSpan={6} style={{ ...S.td, textAlign:"right", fontWeight:700 }}>TOTAL</td>
              <td style={{ ...S.td, textAlign:"right", fontWeight:700, fontSize:15 }}>{BRL(total)}</td>
              <td style={{ ...S.td, textAlign:"right", fontWeight:700, color:"#64748b" }}>{peso > 0 ? KG(peso) : "—"}</td>
              {IND_COM_VOLUME.includes(p.industriaId) && <td style={{ ...S.td, textAlign:"right", fontWeight:700, color:"#2563eb" }}>{calcVolumeTotal(p.itens) > 0 ? VOL(calcVolumeTotal(p.itens)) : "—"}</td>}
            </tr>
            {p.valorFrete > 0 && (
              <tr>
                <td colSpan={6} style={{ ...S.td, textAlign:"right", color:"#64748b" }}>🚚 Custo do Frete ({p.frete})</td>
                <td style={{ ...S.td, textAlign:"right", color:"#64748b", fontWeight:600 }}>{BRL(p.valorFrete)}</td>
                <td style={S.td} />
              </tr>
            )}
          </tfoot>
        </table>

        {/* Condições */}
        <div style={{ display:"flex", gap:24, fontSize:12, color:"#475569", marginBottom:12, flexWrap:"wrap" }}>
          {p.pagamento && <span><strong>Pagamento:</strong> {p.pagamento}</span>}
          {p.frete && <span><strong>Frete:</strong> {p.frete}</span>}
        </div>

        {/* Obs */}
        {p.obs && (
          <div style={{ background:"#f8fafc", borderRadius:6, padding:"10px 12px", fontSize:13, color:"#374151", marginBottom:12 }}>
            <strong>Observações:</strong> {p.obs}
          </div>
        )}

        <div style={{ borderTop:"1px solid #e2e8f0", paddingTop:10, fontSize:11, color:"#94a3b8", textAlign:"center" }}>
          Chazan Representações · {p.numero} · {p.status}
        </div>
      </div>
    </div>
  );
}

// ── CadastroCliente ───────────────────────────────────────────────────────────
function CadastroCliente({ onBack, onSave }) {
  const [form, setForm] = useState({ nome: "", cnpj: "", cidade: "", fone: "", responsavel: "", email: "" });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const [erro, setErro] = useState("");

  const handleSave = () => {
    if (!form.nome.trim()) { setErro("Razão Social é obrigatória."); return; }
    onSave(form);
  };

  const fields = [
    { key: "nome", label: "Razão Social *", placeholder: "Nome ou Razão Social" },
    { key: "cnpj", label: "CNPJ / CPF", placeholder: "00.000.000/0001-00" },
    { key: "cidade", label: "Cidade", placeholder: "Cidade-UF" },
    { key: "fone", label: "Telefone", placeholder: "(00) 00000-0000" },
    { key: "responsavel", label: "Responsável", placeholder: "Nome do contato" },
    { key: "email", label: "E-mail", placeholder: "email@empresa.com.br" },
  ];

  return (
    <div style={S.root}>
      <div style={{ ...S.header, justifyContent:"space-between" }}>
        <button onClick={onBack} style={S.printBack}>← Voltar</button>
        <span style={{ color:"#f1f5f9", fontWeight:700, fontSize:15 }}>Novo Cliente</span>
        <button onClick={handleSave} style={{ ...S.printBtn, background:"#16a34a" }}>✓ Salvar</button>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:16 }}>
        {erro && <div style={{ background:"#dc2626", color:"#fff", padding:"8px 12px", borderRadius:8, marginBottom:12, fontSize:13 }}>{erro}</div>}
        {fields.map(f => (
          <div key={f.key} style={{ marginBottom:14 }}>
            <label style={{ display:"block", color:"#94a3b8", fontSize:12, fontWeight:600, marginBottom:4 }}>{f.label}</label>
            <input
              value={form[f.key]}
              onChange={e => set(f.key, e.target.value)}
              placeholder={f.placeholder}
              style={{ width:"100%", padding:"10px 14px", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:8, color:"#1e293b", fontSize:14, outline:"none", boxSizing:"border-box" }}
            />
          </div>
        ))}
      </div>
    </div>
  );
}

// ── CadastroProduto ───────────────────────────────────────────────────────────
function CadastroProduto({ industrias, onBack, onSave }) {
  const [form, setForm] = useState({ nome: "", codigo: "", industriaId: "", tabela: "revenda", preco_revenda: "", preco_construtora: "", unidade: "", emb_min: "", peso_unit: "", volume_emb: "" });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const [erro, setErro] = useState("");

  const handleSave = () => {
    if (!form.nome.trim()) { setErro("Nome do produto é obrigatório."); return; }
    if (!form.industriaId) { setErro("Selecione a indústria."); return; }
    if (!form.preco_revenda) { setErro("Preço Revenda é obrigatório."); return; }
    onSave({
      ...form,
      preco: Number(String(form.preco_revenda).replace(",",".")),
      preco_revenda: Number(String(form.preco_revenda).replace(",",".")),
      preco_construtora: Number(String(form.preco_construtora).replace(",",".")) || Number(String(form.preco_revenda).replace(",",".")),
      emb_min: Number(form.emb_min) || 1,
      peso_unit: Number(form.peso_unit) || 0,
      volume_emb: Number(String(form.volume_emb || "0").replace(",",".")) || 0,
    });
  };

  return (
    <div style={S.root}>
      <div style={{ ...S.header, justifyContent:"space-between" }}>
        <button onClick={onBack} style={S.printBack}>← Voltar</button>
        <span style={{ color:"#f1f5f9", fontWeight:700, fontSize:15 }}>Novo Produto</span>
        <button onClick={handleSave} style={{ ...S.printBtn, background:"#16a34a" }}>✓ Salvar</button>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:16 }}>
        {erro && <div style={{ background:"#dc2626", color:"#fff", padding:"8px 12px", borderRadius:8, marginBottom:12, fontSize:13 }}>{erro}</div>}

        <div style={{ marginBottom:14 }}>
          <label style={{ display:"block", color:"#94a3b8", fontSize:12, fontWeight:600, marginBottom:4 }}>Indústria *</label>
          <select value={form.industriaId} onChange={e => set("industriaId", e.target.value)}
            style={{ width:"100%", padding:"10px 14px", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:8, color:"#1e293b", fontSize:14, outline:"none", boxSizing:"border-box" }}>
            <option value="">Selecione…</option>
            {industrias.map(i => <option key={i.id} value={i.id}>{i.nome}</option>)}
          </select>
        </div>

        {[
          { key:"nome", label:"Nome do Produto *", placeholder:"Descrição do produto" },
          { key:"codigo", label:"Código", placeholder:"SKU / Código" },
          { key:"unidade", label:"Unidade", placeholder:"M², CX, PÇ, RL..." },
          { key:"preco_revenda", label:"Preço Revenda (R$) *", placeholder:"0,00" },
          { key:"preco_construtora", label:"Preço Construtora (R$)", placeholder:"0,00 (se diferente)" },
          { key:"emb_min", label:"Embalagem Mínima", placeholder:"Ex: 10" },
          { key:"peso_unit", label:"Peso Unitário (kg)", placeholder:"Ex: 1,5" },
          { key:"volume_emb", label:"Volume da Embalagem (m³)", placeholder:"Ex: 0,0345" },
        ].map(f => (
          <div key={f.key} style={{ marginBottom:14 }}>
            <label style={{ display:"block", color:"#94a3b8", fontSize:12, fontWeight:600, marginBottom:4 }}>{f.label}</label>
            <input
              value={form[f.key]}
              onChange={e => set(f.key, e.target.value)}
              placeholder={f.placeholder}
              style={{ width:"100%", padding:"10px 14px", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:8, color:"#1e293b", fontSize:14, outline:"none", boxSizing:"border-box" }}
            />
          </div>
        ))}
      </div>
    </div>
  );
}
